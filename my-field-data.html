<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoExposure™ | My Field Data</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--text:#1f2933;--muted:#6b7280;--border:#d7ded9;--accent:#0f766e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:22px 16px;background:linear-gradient(135deg,#0f766e,#164e63);color:white}header h1{margin:0 0 6px;font-size:1.45rem}header p{margin:0;opacity:.9}
main{max-width:900px;margin:auto;padding:16px}.top-nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top-nav a{color:var(--accent);font-weight:700;text-decoration:none}
.status,.empty{background:#eef7f5;border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.photo{min-height:180px;background:#eef2f1;display:flex;align-items:center;justify-content:center}.photo img{width:100%;max-height:320px;object-fit:cover}.no-photo{color:var(--muted);padding:28px}
.content{padding:14px}.meta{font-size:.84rem;color:var(--muted);line-height:1.5;margin-bottom:10px}.notes{white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<header><h1>My Field Data</h1><p>Your saved field photos, locations, and notes.</p></header>
<main>
<div class="top-nav"><a href="index.html">← Home</a><a href="my-data.html">My Data</a><a href="new_field_data.html">+ Add Field Data</a></div>
<div id="status" class="status">Loading your Field Data...</div>
<div id="entries" class="grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ndiltdoguobelvcdmhms.supabase.co";
const SUPABASE_KEY="sb_publishable_AgCVjaXgVRvooqCphASxZA_YAauoLe4";
const OTHER_DATA_BUCKET="ecotera_home_other_data";
const OTHER_DATA_TABLE="ecotera_home_other_data";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function fmt(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}

async function requireLogin(){
  const {data,error}=await supabaseClient.auth.getUser();
  if(error||!data.user){window.location.replace("login.html");return false}
  currentUser=data.user;return true
}

async function signedUrl(path){
  if(!path)return null;
  const {data,error}=await supabaseClient.storage.from(OTHER_DATA_BUCKET).createSignedUrl(path,3600);
  if(error){console.warn(error);return null}
  return data?.signedUrl||null
}

async function load(){
  const status=document.getElementById("status"),box=document.getElementById("entries");
  if(!await requireLogin())return;
  const {data,error}=await supabaseClient.from(OTHER_DATA_TABLE)
    .select("id,user_id,photo_path,notes,latitude,longitude,created_at")
    .eq("user_id",currentUser.id).order("created_at",{ascending:false});
  if(error){status.textContent="Could not load Field Data: "+error.message;return}
  if(!data||!data.length){status.style.display="none";box.innerHTML='<div class="empty">No Field Data saved yet.</div>';return}
  status.textContent=data.length+" saved entr"+(data.length===1?"y":"ies");
  for(const row of data){
    const url=await signedUrl(row.photo_path);
    const gps=(row.latitude!=null&&row.longitude!=null)?Number(row.latitude).toFixed(5)+", "+Number(row.longitude).toFixed(5):"";
    const card=document.createElement("article");card.className="card";
    card.innerHTML=`<div class="photo">${url?`<img src="${esc(url)}" alt="Field Data photo">`:'<div class="no-photo">No photo</div>'}</div>
      <div class="content"><div class="meta">${row.created_at?`<div><strong>Saved:</strong> ${esc(fmt(row.created_at))}</div>`:""}${gps?`<div><strong>GPS:</strong> ${esc(gps)}</div>`:""}</div>
      <div class="notes">${row.notes?esc(row.notes):'<span style="color:#6b7280">No notes</span>'}</div></div>`;
    box.appendChild(card);
  }
}
load();
</script>
</body>
</html>
