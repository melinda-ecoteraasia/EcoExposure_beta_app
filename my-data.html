<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoExposure™ | My Data</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f6f8f7;--card:#fff;--text:#1f2933;--muted:#6b7280;--border:#d7ded9;--accent:#0f766e;--accent-dark:#115e59}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    header{padding:22px 16px;background:linear-gradient(135deg,#0f766e,#164e63);color:white}header h1{margin:0 0 6px;font-size:1.45rem}header p{margin:0;opacity:.9}
    main{max-width:920px;margin:auto;padding:16px}.top-nav,.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .top-nav a{color:var(--accent);font-weight:700;text-decoration:none}
    .filters button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
    .filters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .status{background:#eef7f5;border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--muted);margin-bottom:16px}
    .entry{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
    .entry-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}.entry-head h3{margin:0;font-size:1.05rem}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:800;background:#eef7f5;color:var(--accent);margin-bottom:7px}
    .meta{color:var(--muted);font-size:.9rem;line-height:1.5}.notes{white-space:pre-wrap;line-height:1.5;margin-top:10px}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
    .photo-grid img{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
    @media(max-width:640px){.entry-head{flex-direction:column}}
  </style>
</head>
<body>
<header>
  <h1>My Data</h1>
  <p>All of your EcoExposure samples and Field Data, organized by time.</p>
</header>
<main>
  <div class="top-nav">
    <a href="index.html">← Home</a>
    <a href="my-samples.html">My Samples</a>
    <a href="my-field-data.html">My Field Data</a>
    <a href="new-sample.html">+ New Sample</a>
    <a href="new_field_data.html">+ Field Data</a>
  </div>

  <div class="filters">
    <button id="filter-all" class="active" onclick="setFilter('all')">All Data</button>
    <button id="filter-samples" onclick="setFilter('sample')">EcoExposure Samples</button>
    <button id="filter-field" onclick="setFilter('field_data')">Field Data</button>
  </div>

  <div id="status" class="status">Loading your data...</div>
  <div id="entries"></div>
</main>

<script>
const SUPABASE_URL="https://ndiltdoguobelvcdmhms.supabase.co";
const SUPABASE_KEY="sb_publishable_AgCVjaXgVRvooqCphASxZA_YAauoLe4";
const FIELD_DATA_BUCKET="ecotera_home_other_data";
const FIELD_DATA_TABLE="ecotera_home_other_data";
const SAMPLE_TABLE="samples";

const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let allEntries=[];
let activeFilter="all";

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function fmt(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString()}

async function requireLogin(){
  const {data,error}=await supabaseClient.auth.getUser();
  if(error||!data.user){window.location.replace("login.html");return false}
  currentUser=data.user;return true
}

async function signedUrl(bucket,path){
  if(!bucket||!path)return null;
  const {data,error}=await supabaseClient.storage.from(bucket).createSignedUrl(path,3600);
  if(error){console.warn("Signed URL error",bucket,path,error);return null}
  return data?.signedUrl||null;
}

async function load(){
  const status=document.getElementById("status");
  if(!await requireLogin())return;

  const [samplesResult,fieldResult]=await Promise.all([
    supabaseClient.from(SAMPLE_TABLE).select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false}),
    supabaseClient.from(FIELD_DATA_TABLE).select("id,user_id,photo_path,notes,latitude,longitude,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false})
  ]);

  if(samplesResult.error){status.textContent="Could not load EcoExposure samples: "+samplesResult.error.message;return}
  if(fieldResult.error){status.textContent="Could not load Field Data: "+fieldResult.error.message;return}

  const samples=(samplesResult.data||[]).map(x=>({...x,_type:"sample"}));
  const field=(fieldResult.data||[]).map(x=>({...x,_type:"field_data"}));

  allEntries=[...samples,...field].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  status.textContent=allEntries.length+" total entr"+(allEntries.length===1?"y":"ies");
  render();
}

function setFilter(v){
  activeFilter=v;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  document.getElementById(v==="all"?"filter-all":v==="sample"?"filter-samples":"filter-field").classList.add("active");
  render();
}

async function render(){
  const box=document.getElementById("entries");
  box.innerHTML="";
  const rows=allEntries.filter(x=>activeFilter==="all"||x._type===activeFilter);

  if(!rows.length){box.innerHTML='<div class="status">No entries in this view yet.</div>';return}

  for(const row of rows){
    const card=document.createElement("article");
    card.className="entry";

    if(row._type==="sample"){
      const title=row.sample_id||"Untitled sample";
      const stage=row.capture_stage==="pre_reagent"?"Pre-Reagent":row.capture_stage==="post_reaction"?"Post-Reaction":row.capture_stage||"";
      card.innerHTML=`
        <div class="badge">EcoExposure Sample</div>
        <div class="entry-head">
          <h3>${esc(title)}</h3>
          <div class="meta">${esc(fmt(row.created_at))}</div>
        </div>
        <div class="meta">
          ${stage?`<div><strong>Stage:</strong> ${esc(stage)}</div>`:""}
          ${row.location?`<div><strong>Location:</strong> ${esc(row.location)}</div>`:""}
          ${row.water_type?`<div><strong>Water Type:</strong> ${esc(row.water_type)}</div>`:""}
          ${(row.latitude!=null&&row.longitude!=null)?`<div><strong>GPS:</strong> ${esc(Number(row.latitude).toFixed(5)+", "+Number(row.longitude).toFixed(5))}</div>`:""}
        </div>
        ${row.notes?`<div class="notes">${esc(row.notes)}</div>`:""}
      `;

      const photoPairs=[
        ["Top",row.top_photo],["Top Grid",row.top_grid_photo],["Side",row.side_photo],
        ["Close-Up",row.closeup_photo],["Other",row.other_photo]
      ].filter(x=>x[1]);

      if(photoPairs.length && row.storage_bucket){
        const grid=document.createElement("div");grid.className="photo-grid";
        for(const [label,path] of photoPairs){
          const url=await signedUrl(row.storage_bucket,path);
          if(url){const img=document.createElement("img");img.src=url;img.alt=label;img.loading="lazy";grid.appendChild(img)}
        }
        card.appendChild(grid);
      }
    } else {
      const gps=(row.latitude!=null&&row.longitude!=null)?Number(row.latitude).toFixed(5)+", "+Number(row.longitude).toFixed(5):"";
      card.innerHTML=`
        <div class="badge">Field Data</div>
        <div class="entry-head">
          <h3>Field Observation</h3>
          <div class="meta">${esc(fmt(row.created_at))}</div>
        </div>
        <div class="meta">${gps?`<div><strong>GPS:</strong> ${esc(gps)}</div>`:""}</div>
        ${row.notes?`<div class="notes">${esc(row.notes)}</div>`:'<div class="notes" style="color:#6b7280">No notes</div>'}
      `;
      if(row.photo_path){
        const url=await signedUrl(FIELD_DATA_BUCKET,row.photo_path);
        if(url){const grid=document.createElement("div");grid.className="photo-grid";const img=document.createElement("img");img.src=url;img.alt="Field Data photo";img.loading="lazy";grid.appendChild(img);card.appendChild(grid)}
      }
    }

    box.appendChild(card);
  }
}

load();
</script>
</body>
</html>
